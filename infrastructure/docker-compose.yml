version: "3.8"

services:
  postgres:
    image: postgres:17
    restart: always7
    container_name: discboxd_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d meu_banco"]
      interval: 5s
      timeout: 5s
      retries: 5

    backend:
      build:
        context: ../backend
        dockerfile: ./Dockerfile
      container_name: discboxd_backend
      restart: always
      ports:
        - "3333:3333"
      env_file:
        - ../backend/.env
      depends_on:
        postgres:
          condition: service_healthy

    public-profile:
      build:
        context: ../frontend/apps/public-profile
        dockerfile: ./Dockerfile
      container_name: discboxd_public_profile
      restart: always
      ports:
        - "3002:3002"

    private-profile:
      build:
        context: ../frontend/apps/private-profile
        dockerfile: ./Dockerfile
      container_name: discboxd_private_profile
      restart: always
      ports:
        - "3001: 3001"
  
    main:
      build:
        context: ../frontend/apps/main
        dockerfile: ./Dockerfile
      container_name: discboxd_frontend_main
      restart: aways
      ports:
        - "3000:3000"


